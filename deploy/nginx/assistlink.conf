# Include inside the HTTPS server block for your domain. Omitting the trailing
# slash from proxy_pass preserves the /assistlink path expected by Express.
location = /assistlink {
    return 301 /assistlink/;
}

location /assistlink/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 75s;
    # Slightly above the API's 5 MiB résumé limit so Express can return the
    # application's consistent JSON validation response.
    client_max_body_size 6m;
}
