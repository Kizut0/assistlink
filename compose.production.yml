name: assistlink

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: assistlink
      POSTGRES_DB: assistlink
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistlink -d assistlink"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: assistlink-api:local
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 8081
      HOME: /tmp
      AZURE_KEY_VAULT_URL: ${AZURE_KEY_VAULT_URL:?Set AZURE_KEY_VAULT_URL}
      AD_CLIENT_ID: ${AD_CLIENT_ID:?Set AD_CLIENT_ID}
      AD_TENANT_ID: ${AD_TENANT_ID:?Set AD_TENANT_ID}
      AD_REDIRECT_URI: ${AD_REDIRECT_URI:?Set AD_REDIRECT_URI}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8081/assistlink/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE}

volumes:
  postgres_data:
